;T7 GHOST AI MOD - VERSION 0.6.3
;FIND THE LATEST RELEASE AT . . . 

[ai]
mod_enabled=1
; 1 = the replay-trained AI replaces the CPU offline: Practice "CPU" dummy at Ultra Hard, Arcade and Treasure Battle (never online)


arcade=1
; 1 = also in Arcade Battle (characters without a profile keep the game's CPU)


treasure_battle=1
; 1 = also in Treasure Battle (characters without a profile keep the game's CPU)


reaction_frames=14
; frames before the AI reacts to what you do (60 = 1 second). 13-15 = strong human


input_read_chance=0
; 0-100: chance per move that the AI "reads" your move instantly (cheat). 0 = fair


punish=1
; 1 = always punish when a punisher the player used fits the window


combos=1
; 1 = continue juggles with the player's own combos


guard_skill=100
; 0-100: how often perceived attacks are guarded correctly (scaled by the player's guard habit)


decision_skill=60
; 0-100: favour the player's attacks that landed (hit/counter/launch) over whiffs and stuffed moves


adapt=70
; 0-100: how strongly the AI adapts to YOUR habits learned during play (kept per character you use)


throw_break_chance=0
; throw breaks: 0 = each player's own break rate from the replays (most ~5-15%), 1 = never, 2-100 = % chance (100 = always)


wall_awareness=1
; 1 = walls change how it plays: sidesteps away from walls, defends corners (and throws out of them),
; presses you harder with heavy moves when your back is to a wall. 0 = off (if it plays strangely)



[ui]
menu_key=F1
; key that opens/closes the in-game settings panel: F1-F12, Insert, Home, End, PageUp, a letter...;
; modifiers allowed, e.g. Ctrl+F1, Shift+Home



[ghost_battle]
enabled=1
; 1 = Ghost Battle Mode: Treasure Battle uses the round count from your Game Options


random_stage=1
; 1 = a random stage every fight (the game keeps one stage for 5 fights)


ghost_opponents=1
; 1 = opponents only from characters with a Ghost profile


special_fights=1
; 1 = keep Treasure Battle's special fights (Turbo etc.), 0 = every fight is a regular fight


default_costumes=0
; 1 = opponents wear their default costume, 0 = the ghosts' own customised outfits


end_menu=1
; 1 = after each match: rematch, rematch on a new stage, 3 next opponents, character select, main menu


random_player=0
; 1 = each ghost imitates one random recorded player, 0 = the usual profile ([profiles], merged by default)



[profiles]
; per character id: c21=merged (default: all recorded players as one),
; c21=hybrid (best player's style, other players fill gaps + share punishes/combos), or c21=Katarina-P01 (that player only)



[scan]
; dev tool region: data = exe .data section, state = newest fight-state block
region=data
