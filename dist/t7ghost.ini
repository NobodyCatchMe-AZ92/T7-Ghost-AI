;T7 GHOST AI MOD - VERSION 1.1a
;CHECK FOR UPDATES: the GitHub page https://github.com/NobodyCatchMe-AZ92/T7-Ghost-AI or tekkenmods.com

[ai]
mod_enabled=1
; 1 = the replay-trained AI replaces the CPU offline: Practice "CPU" dummy at Ultra Hard, Arcade and Treasure Battle (never online)


arcade=1
; 1 = also in Arcade Battle (characters without a profile keep the game's CPU)


treasure_battle=1
; 1 = also in Treasure Battle (characters without a profile keep the game's CPU)


ai_preset=3
; Ghost AI Preset: 0 = Custom Settings (the values below), 1 = Fair, 2 = Medium Challenge, 3 = Challenging, 4 = Unfair. A preset overrides the values below (they are kept for Custom Settings).


reaction_frames=14
; frames before the AI reacts to what you do (60 = 1 second). 13-15 = strong human


input_read_chance=0
; 0-100: chance per move that the AI "reads" your move instantly (cheat). 0 = fair


punish_proficiency=50
; 0-100: Punishment Proficiency. 0 = the player's own punishers and timing; 1-100 = chance that a punish is perfect (the best punish for that opening, on the first possible frame)


combo_style=1
; 0 = the player's own combo habits, 1 = finish combos when appropriate (recorded routes, ended early when a hit misses or a wall is close), 2 = always finish combos


guard_skill=100
; 0-100: how often perceived attacks are guarded correctly (scaled by the player's guard habit)


decision_skill=60
; 0-100: How much the Ghosts favour attacks that are statistically proven to land more often than ones that whiffed or got counter-hit.


adapt=70
; 0-100: how strongly the AI adapts to YOUR habits learned during play (kept per character you use)


throw_break_chance=0
; throw breaks: 0 = each player's own break rate from the replays (most ~5-15%), 1 = never, 2-100 = % chance (100 = always)


wall_awareness=1
; 1 = on, 0 = off. Tick to let the location of nearby walls influence the Ghost's behaviors. Ghosts will sidestep away from walls, defend near corners, pressure you against walls.



[ui]
menu_key=F1
; key that opens/closes the in-game settings panel: F1-F12, Insert, Home, End, PageUp, a letter...;
; modifiers allowed, e.g. Ctrl+F1, Shift+Home



[ghost_battle]
enabled=1
; 1 = on, 0 = off. Converts Treasure Battle into Ghost Battle - round counts affected by your Game Options, Random Stages every new match, and more.


random_stage=1
; 1 = on, 0 = off. A new random stage every match (the game normally keeps one stage for five fights).


ghost_opponents=1
; 1 = on, 0 = off. Only queue characters that have Ghost data. Characters without Ghost data will never appear with this option ticked.


special_boss=0
; 1 = on, 0 = off. Special fights: boss encounters (Devil Kazumi and the special opponents, e.g. Akuma, Jin). Off = a regular fight instead.


special_turbo=0
; 1 = on, 0 = off. Special fights: Turbo Battle (a ranked ghost fight at a faster game speed).


special_heist=0
; 1 = on, 0 = off. Special fights: Heist Battle (a special encounter with its own opponent).


special_double_damage=0
; 1 = on, 0 = off. Special fights: Double Damage Battle (every hit does double damage).


special_aerial_juggle=0
; 1 = on, 0 = off. Special fights: Aerial Juggle Battle (only juggles do damage).


costumes=0
; 0 = Default Treasure Battle CPU Costumes (the ranked ghosts' customized outfits), 1 = 1P Costumes Only, 2 = 1P, 2P, 3P, 4P Costumes Only (a random one per opponent; 3P and 4P only for the characters that have them), 3 = 1P-4P and Preset Costumes, 4 = 1P-4P, Preset, and Player Customizations, 5 = 1P-4P and Player Customizations, 6 = Player's Own Customizations Only (a 1P-4P costume for characters you have none for), 7 = Random (all of the above).


custom_slot=0
; Customization slot to force on Ghosts (Costumes 4-7): 0 = Any (a random pick from the slots you saved for that character), 1-10 = that slot (characters without one in it wear a 1P-4P costume).


end_menu=1
; 1 = on, 0 = off. Tick to enable Ghost Battle's custom end of match menu options (choose the next opponent, rematch with same stage, rematch on new stage, etc)


native_menu=1
; 1 = on, 0 = off. Show the end-of-match menu inside the game's own result window. 0 = the overlay menu instead.


rename=1
; 1 = on, 0 = off. The main menu calls the mode GHOST BATTLE instead of TREASURE BATTLE.


hide_chests=1
; 1 = on, 0 = off. No treasure chest icons on the match HUD (the results screen still shows your rewards).


random_player=0
; 1 = on, 0 = off. Tick to make it so every opponent you encounter is only based on ONE ghost profile. Ticking this option makes the opponents you encounter less intelligent overall, but more unique in playstyle (e.g. you may encounter two Paul opponents who play very differently). Recommended is unticked/disabled.



[modifiers]
no_rage=0
; 1 = on, 0 = off. No Rage: nobody gets rage (no rage damage boost, Rage Arts or Rage Drives). Offline battles only, from the next match.


no_power_crush=0
; 1 = on, 0 = off. No Power Crush: power crush moves lose their armor. Offline battles only, from the next match.


no_screw=0
; 1 = on, 0 = off. No Screw: screw moves give a normal juggle hit instead of extending the combo. Offline battles only, from the next match.


health=100
; Health: both players' health bars in percent of normal (25-500; 200 = twice the damage to KO). Offline battles only, from the next match.



[profiles]
; per character id: c21=merged (default: all recorded players as one),
; c21=hybrid (best player's style, other players fill gaps + share punishes/combos), or c21=Katarina-P01 (that player only)



[scan]
; dev tool region: data = exe .data section, state = newest fight-state block
region=data
